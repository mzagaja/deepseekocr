[project]
name = "deepseek-ocr-pdf"
version = "0.1.0"
description = "Replace a PDF's text layer using DeepSeek-OCR-2 via Ollama"
requires-python = ">=3.11"
dependencies = [
    "ocrmypdf>=17.10,<18",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deepseek-ocr-pdf = "deepseek_ocr_pdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_ocr_pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a running Ollama with the model pulled"]
